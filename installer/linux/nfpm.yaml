# .deb and .rpm packages of the CloudOrc Backup Agent (built with nfpm: https://nfpm.goreleaser.com).
#   RID=linux-x64 ARCH=amd64 VERSION=1.0.0 nfpm package -f installer/linux/nfpm.yaml -p deb -t dist/
#   RID=linux-x64 ARCH=amd64 VERSION=1.0.0 nfpm package -f installer/linux/nfpm.yaml -p rpm -t dist/
# After installing the package:  sudo cloudorc-backup activate <CODE>
name: cloudorc-backup
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: CloudOrc <support@cloudorc.com>
vendor: CloudOrc
homepage: https://cloudorc.com
license: Proprietary
description: |
  CloudOrc Backup Agent - encrypted, incremental backup of files, folders and
  PostgreSQL databases to CloudOrc storage, managed from the CloudOrc portal.

contents:
  - src: ./dist/${RID}/cloudorc-backup/bin/
    dst: /opt/cloudorc-backup/bin/
  - src: ./dist/${RID}/cloudorc-backup/engines/
    dst: /opt/cloudorc-backup/engines/
  - src: ./dist/${RID}/cloudorc-backup/share/
    dst: /opt/cloudorc-backup/share/
  - src: ./dist/${RID}/cloudorc-backup/VERSION
    dst: /opt/cloudorc-backup/VERSION
  - src: ./installer/linux/cloudorc-backup-agent.service
    dst: /etc/systemd/system/cloudorc-backup-agent.service
    type: config
  - src: ./installer/linux/cloudorc-backup-watchdog.service
    dst: /etc/systemd/system/cloudorc-backup-watchdog.service
    type: config
  - src: /opt/cloudorc-backup/bin/cloudorc-backup
    dst: /usr/local/bin/cloudorc-backup
    type: symlink

scripts:
  postinstall: ./installer/linux/package-postinstall.sh
  preremove: ./installer/linux/package-preremove.sh

rpm:
  compression: zstd
deb:
  compression: zstd
